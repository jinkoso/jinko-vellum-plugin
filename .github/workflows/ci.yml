name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # skills/jinko-travel/ is rendered from vendor/jinko-skills/ plus the
      # Vellum overlay. This fails the build when the two have drifted — from a
      # hand-edit of the rendered skill, or a vendor sync whose render was not
      # committed. It reads no network: the upstream is vendored.
      - name: Skill is rendered from the vendored upstream
        run: bun scripts/render-skill.ts --check
